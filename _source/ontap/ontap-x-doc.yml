root_overview:
  ai-gen:
    keywords: ontap rest, json response, storage management, http status codes, hal
      linking
    lead: The ONTAP REST API introduces an expansive range of endpoints designed to
      interact with ONTAP's resources such as clusters, SVMs, and storage. Leverage
      these API calls for managing configurations, software updates, and monitoring
      tasks critical to maintaining your ONTAP environment efficiently.
categories:
- id: cloud
  title: ONTAP REST API cloud endpoints
  permalink: cloud_endpoints.html
  ai-gen:
    keywords: cloud targets,object storage,manage cloud,storage management,cloud integration
    lead: Manage cloud object storage targets to integrate and optimize your cloud
      resources within ONTAP environments.
- id: cluster
  title: ONTAP REST API cluster endpoints
  permalink: cluster_endpoints.html
  ai-gen:
    keywords: cluster creation,add nodes,cluster configuration,node management,software
      update,job monitoring
    lead: Create and manage your ONTAP cluster using endpoints that cover tasks from
      initial setup to ongoing configuration and monitoring. These APIs support workflows
      like adding nodes, managing configuration data, and updating software, with
      specific endpoints available even before cluster creation.
- id: networking
  title: ONTAP REST API networking endpoints
  permalink: networking_endpoints.html
  ai-gen:
    keywords: networking information, ipspaces, ethernet ports, fibre channel interfaces,
      broadcast domains, service policies
    lead: Explore networking endpoints to report and manage key networking components
      such as IPspaces, interfaces, routes, ports, service policies, and broadcast
      domains. Use these endpoints to configure and monitor the networking aspects
      of your ONTAP environment efficiently.
- id: svm
  title: ONTAP REST API SVM endpoints
  permalink: svm_endpoints.html
  ai-gen:
    keywords: storage virtual machine, svm management, cifs configuration, nfs protocols,
      network services
    lead: Manage Storage Virtual Machines (SVMs) and their attributes using ONTAP
      REST API endpoints to configure protocols, export policies, name mappings, and
      network services. These endpoints are essential for establishing secure, isolated
      data storage environments that serve data to NAS and SAN clients.
- id: name-services
  title: ONTAP REST API name-services endpoints
  permalink: name-services_endpoints.html
  ai-gen:
    keywords: name-services, ldap configuration, dns resolving, nis servers, ns-switch
    lead: Access name-services endpoints to manage user and client information for
      authentication and credential mapping in mixed environments. Configure NIS,
      LDAP, DNS, and ns-switch within ONTAP to ensure proper user database integration
      and hostname resolution.
- id: san
  title: ONTAP REST API SAN endpoints
  permalink: san_endpoints.html
  ai-gen:
    keywords: fibre channel,iscsi sessions,initiator groups,lun maps,portsets,vvol
      bindings
    lead: Configure, provision, and manage SAN-related objects using the storage area
      network (SAN) endpoints. Use these endpoints to maintain and optimize your SAN
      environment effectively.
- id: nvme
  title: ONTAP REST API NVMe endpoints
  permalink: nvme_endpoints.html
  ai-gen:
    keywords: nvme provisioning,nvme configuration,fibre channel logins,nvme interfaces,nvme
      subsystems,nvme namespaces
    lead: Configure, provision, and manage NVMe-related objects using these REST API
      endpoints to support storage operations involving NVMe and NVMe over Fabrics
      protocols. Utilize these endpoints to implement NVMe services, subsystem configurations,
      and namespace access control for connected hosts.
- id: application
  title: ONTAP REST API application endpoints
  permalink: application_endpoints.html
  ai-gen:
    keywords: storage management, application templates, virtualization applications,
      smart containers, snapshot copies
    lead: ONTAP application endpoints streamline storage management by using application-specific
      terminology, facilitating provisioning and management of storage objects. With
      these APIs, you can configure storage and protocol access for applications while
      adhering to NetApp best practices. Application templates support numerous database
      and virtualization applications, allowing you to manage ONTAP components collectively.
- id: support
  title: ONTAP REST API support endpoints
  permalink: support_endpoints.html
  ai-gen:
    keywords: configuration backups,event management,event notifications,autosupport
      settings,cluster settings,email destination
    lead: Use ONTAP support endpoints to manage configuration backups, autosupport
      settings, and event handling efficiently. These APIs help ensure the resilience
      and reliability of your ONTAP environment by safeguarding critical configuration
      data and alerting you to system events.
- id: security
  title: ONTAP REST API security endpoints
  permalink: security_endpoints.html
  ai-gen:
    keywords: security settings,cluster security,SVM security,SAML configuration,multi-factor
      authentication,identity provider
    lead: Use security endpoints to manage security settings for your cluster and
      SVMs, ensuring robust protection and compliance. Configure SAML 2.0 SP protocol
      to integrate third-party identity providers for enhanced authentication measures.
- id: storage
  title: ONTAP REST API storage endpoints
  permalink: storage_endpoints.html
  ai-gen:
    keywords: ontap storage,physical storage,logical storage,storage management,storage
      efficiency,snapshots
    lead: Manage physical and logical storage with endpoints designed for aggregates,
      volumes, LUNs, qtrees, snapshots, quotas, and storage efficiency. Use these
      APIs to organize and optimize your storage resources effectively.
- id: snapmirror
  title: ONTAP REST API SnapMirror endpoints
  permalink: snapmirror_endpoints.html
  ai-gen:
    keywords: snapmirror technology,snapmirror backup,snapmirror restore,snapmirror
      policies,snapmirror relationships,snapmirror transfers
    lead: Use SnapMirror endpoints to efficiently manage data replication and backup
      relationships, ensuring your production data remains protected. These endpoints
      facilitate the creation and management of SnapMirror relationships, policies,
      and data transfers, supporting both asynchronous and synchronous replication
      types for robust data recovery and continuity.
- id: ndmp
  title: ONTAP REST API NDMP endpoints
  permalink: ndmp_endpoints.html
  ai-gen:
    keywords: ndmp protocol,backup efficiency,nas data protection,svm aware,volume
      mobility,node configurations
    lead: Utilize NDMP endpoints to optimize the backup and restoration of NAS data
      through standardized network commands. These endpoints enhance performance by
      facilitating direct data transfer to tape storage and support SVM-aware backups
      for efficient data handling.
- id: snaplock
  title: ONTAP REST API SnapLock endpoints
  permalink: snaplock_endpoints.html
  ai-gen:
    keywords: snaplock storage,compliance clock,event retention,file retention,privileged
      delete,legal hold
    lead: Utilize SnapLock endpoints to manage the secure storage and retention of
      WORM data within your ONTAP environment. These endpoints support regulatory
      compliance by ensuring data is non-rewritable and non-erasable for specified
      retention periods, even in the presence of untrusted parties.
- id: nas
  title: ONTAP REST API NAS endpoints
  permalink: nas_endpoints.html
  ai-gen:
    keywords: nfs server,svm configuration,export policies,kerberos realm,data lif
    lead: Manage NFS servers, configurations, and export policies on your ONTAP system
      using NAS endpoints. These APIs enable you to create, update, and view NFS settings
      and export rules for secure and controlled data access. Configure Kerberos realms
      and interfaces to enhance authentication for NFS operations across your storage
      environment.
subcategories:
- id: manage application snapshot copies
  permalink: manage_application_snapshot_copies.html
  ai-gen:
    keywords: snapshot copies,application consistency,crash consistency,snapcenter
      backup,record keeping,storage elements
    lead: Manage application Snapshot copies across storage elements to ensure data
      protection and consistency. Create and restore Snapshot copies at any time or
      as part of a schedule, with options for application or crash consistency. For
      accurate coordination with host applications, consider using the SnapCenter
      Backup Management suite.
- id: manage application consistency groups
  permalink: manage_application_consistency_groups.html
  ai-gen:
    keywords: consistency group,volume snapshot,write fence,crash consistent,SAN volume,storage
      policy
    lead: Consistency group APIs manage groups of volumes to facilitate operations
      like snapshots, replication, and cloning across multiple volumes simultaneously.
      Use these endpoints to ensure data consistency in applications with datasets
      spanning multiple volumes, by coordinating write fencing and flushing before
      executing operations.
- id: retrieve consistency group metrics
  permalink: retrieve_consistency_group_metrics.html
  ai-gen:
    keywords: consistency group,performance metrics,capacity metrics,historical data,iops
